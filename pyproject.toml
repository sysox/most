[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "most-ai"
version = "0.1.0"
description = "File-based multi-provider AI access safety kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
browser = ["selenium>=4.25"]

[tool.setuptools.packages.find]
include = ["most*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
