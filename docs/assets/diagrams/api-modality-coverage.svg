<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>most api route — modality coverage, image input vs output clarified</title>
<desc>Only ai-image produces an image as output. ai-chat and ai-image-analyze accept an image only as input context, and always respond with text.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.t{font-size:14px;fill:#2C2C2A;}
.ts{font-size:12px;fill:#5F5E5A;}
.th{font-size:14px;font-weight:600;fill:#2C2C2A;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;} .c-gray .th{fill:#2C2C2A;} .c-gray .ts{fill:#444441;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;} .c-teal .th{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;} .c-purple .th{fill:#3C3489;} .c-purple .ts{fill:#534AB7;}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;} .c-coral .th{fill:#712B13;} .c-coral .ts{fill:#993C1D;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="50" y="70" width="580" height="458" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="90" text-anchor="middle" dominant-baseline="central">most — api route modality commands</text>
</g>

<g class="c-teal">
<rect x="90" y="112" width="500" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">ai-chat</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">text + image (context) → text</text>
</g>
<g class="c-teal">
<rect x="90" y="180" width="500" height="56" rx="10" stroke-width="1"/>
<text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">ai-image</text>
<text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">text → image (generation — only output-image command)</text>
</g>
<g class="c-teal">
<rect x="90" y="248" width="500" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="266" text-anchor="middle" dominant-baseline="central">ai-image-analyze</text>
<text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">text + image (context) → text</text>
</g>
<g class="c-purple">
<rect x="90" y="316" width="500" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central">ai-speech</text>
<text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">text → audio (TTS)</text>
</g>
<g class="c-purple">
<rect x="90" y="384" width="500" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="402" text-anchor="middle" dominant-baseline="central">ai-transcribe</text>
<text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">audio → text (Whisper / ASR)</text>
</g>
<g class="c-coral">
<rect x="90" y="452" width="500" height="56" rx="10" stroke-width="1"/>
<text class="th" x="340" y="470" text-anchor="middle" dominant-baseline="central">ai-embed</text>
<text class="ts" x="340" y="492" text-anchor="middle" dominant-baseline="central">text → vector (RAG building block)</text>
</g>

<rect x="60" y="548" width="560" height="90" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="566" text-anchor="middle">cli + browser routes: text/image only, no audio/embed</text>
<text class="ts" x="340" y="584" text-anchor="middle">only ai-image outputs an image (generation)</text>
<text class="ts" x="340" y="602" text-anchor="middle">ai-chat / ai-image-analyze: image is input context, output is text</text>
<text class="ts" x="340" y="620" text-anchor="middle">ai-embed outputs vectors only — RAG search logic not implemented</text>
</svg>
