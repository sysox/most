<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MOST access routes and their capabilities</title>
<desc>Three routes through MOST — API, browser, and CLI — each with different capability.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.t{font-size:14px;fill:#2C2C2A;}
.ts{font-size:12px;fill:#5F5E5A;}
.th{font-size:14px;font-weight:600;fill:#2C2C2A;}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3;fill:none;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
rect.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;} .c-gray .th{fill:#2C2C2A;} .c-gray .ts{fill:#444441;}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5;} .c-blue .th{fill:#0C447C;} .c-blue .ts{fill:#185FA5;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;} .c-teal .th{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;} .c-coral .th{fill:#712B13;} .c-coral .ts{fill:#993C1D;}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;} .c-purple .th{fill:#3C3489;} .c-purple .ts{fill:#534AB7;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-purple">
<rect x="40" y="20" width="600" height="50" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">tandem</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">picks route + model + role per task, no capability of its own</text>
</g>
<line x1="340" y1="70" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="40" y="96" width="600" height="34" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="113" text-anchor="middle" dominant-baseline="central">most — auth, credentials, journal, execution gate</text>
</g>

<line x1="150" y1="130" x2="150" y2="156" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="130" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="130" x2="530" y2="156" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="60" y="156" width="180" height="46" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="174" text-anchor="middle" dominant-baseline="central">api route</text>
<text class="ts" x="150" y="192" text-anchor="middle" dominant-baseline="central">raw model call</text>
</g>
<g class="c-blue">
<rect x="250" y="156" width="180" height="46" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">browser route</text>
<text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">drives web chat UI</text>
</g>
<g class="c-teal">
<rect x="440" y="156" width="180" height="46" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="174" text-anchor="middle" dominant-baseline="central">cli route</text>
<text class="ts" x="530" y="192" text-anchor="middle" dominant-baseline="central">wraps claude/codex/opencode</text>
</g>

<line x1="150" y1="202" x2="150" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="202" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="202" x2="530" y2="228" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="60" y="228" width="180" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="248" text-anchor="middle" dominant-baseline="central">text/image in</text>
<text class="th" x="150" y="266" text-anchor="middle" dominant-baseline="central">text/image out</text>
<text class="ts" x="150" y="288" text-anchor="middle" dominant-baseline="central">stateless per call</text>
</g>
<g class="c-gray">
<rect x="250" y="228" width="180" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">+ WebUI tools</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">python sandbox,</text>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">image gen — server side</text>
</g>
<g class="c-coral">
<rect x="440" y="228" width="180" height="80" rx="8" stroke-width="1"/>
<text class="th" x="530" y="248" text-anchor="middle" dominant-baseline="central">reads/writes local files</text>
<text class="ts" x="530" y="266" text-anchor="middle" dominant-baseline="central">diffs, applies patches</text>
<text class="ts" x="530" y="284" text-anchor="middle" dominant-baseline="central">capability of the CLI itself</text>
</g>

<line class="leader" x1="530" y1="308" x2="530" y2="336"/>
<text class="ts" x="530" y="352" text-anchor="middle">most does not add this — it inherits it</text>
<text class="ts" x="530" y="368" text-anchor="middle">from the wrapped binary and just gates/logs it</text>

<line class="leader" x1="150" y1="308" x2="150" y2="336"/>
<line class="leader" x1="340" y1="308" x2="340" y2="336"/>
<text class="ts" x="245" y="352" text-anchor="middle">no filesystem access,</text>
<text class="ts" x="245" y="368" text-anchor="middle">whatever route you pick</text>

<rect x="60" y="396" width="560" height="60" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="416" text-anchor="middle">rule: capability = property of the route, not of most</text>
<text class="ts" x="340" y="436" text-anchor="middle">tandem orchestrates across routes — it never grants new capability either</text>
</svg>
