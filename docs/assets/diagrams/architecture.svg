<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>most architecture — kernel and routes</title>
<desc>most is an access kernel with four shared internal parts — credential store, catalog, execution gate, journal — used identically by three routes: api, cli, and browser. Only the cli route inherits file read/write capability.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.t{font-size:14px;fill:#2C2C2A;}
.ts{font-size:12px;fill:#5F5E5A;}
.th{font-size:14px;font-weight:600;fill:#2C2C2A;}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3;fill:none;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;} .c-gray .th{fill:#2C2C2A;} .c-gray .ts{fill:#444441;}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5;} .c-blue .th{fill:#0C447C;} .c-blue .ts{fill:#185FA5;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;} .c-teal .th{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;} .c-coral .th{fill:#712B13;} .c-coral .ts{fill:#993C1D;}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;} .c-purple .th{fill:#3C3489;} .c-purple .ts{fill:#534AB7;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="270" y="20" width="140" height="36" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="38" text-anchor="middle" dominant-baseline="central">you</text>
</g>
<line x1="340" y1="56" x2="340" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="50" y="80" width="580" height="215" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="100" text-anchor="middle" dominant-baseline="central">most — access kernel</text>
</g>

<g class="c-blue">
<rect x="70" y="125" width="260" height="65" rx="10" stroke-width="0.5"/>
<text class="th" x="200" y="145" text-anchor="middle" dominant-baseline="central">credential store</text>
<text class="ts" x="200" y="163" text-anchor="middle" dominant-baseline="central">API keys, keyring per provider</text>
</g>
<g class="c-teal">
<rect x="350" y="125" width="260" height="65" rx="10" stroke-width="0.5"/>
<text class="th" x="480" y="145" text-anchor="middle" dominant-baseline="central">catalog</text>
<text class="ts" x="480" y="163" text-anchor="middle" dominant-baseline="central">providers, models, aliases</text>
</g>
<g class="c-coral">
<rect x="70" y="205" width="260" height="65" rx="10" stroke-width="0.5"/>
<text class="th" x="200" y="225" text-anchor="middle" dominant-baseline="central">execution gate</text>
<text class="ts" x="200" y="243" text-anchor="middle" dominant-baseline="central">approve, diff, sensitivity tier</text>
</g>
<g class="c-purple">
<rect x="350" y="205" width="260" height="65" rx="10" stroke-width="0.5"/>
<text class="th" x="480" y="225" text-anchor="middle" dominant-baseline="central">journal</text>
<text class="ts" x="480" y="243" text-anchor="middle" dominant-baseline="central">every call recorded</text>
</g>

<line x1="150" y1="295" x2="150" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="295" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="295" x2="530" y2="330" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="65" y="330" width="170" height="55" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="350" text-anchor="middle" dominant-baseline="central">api route</text>
<text class="ts" x="150" y="368" text-anchor="middle" dominant-baseline="central">text/image only</text>
</g>
<g class="c-teal">
<rect x="255" y="330" width="170" height="55" rx="8" stroke-width="1"/>
<text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">cli route</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">reads/writes files</text>
</g>
<g class="c-blue">
<rect x="445" y="330" width="170" height="55" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="350" text-anchor="middle" dominant-baseline="central">browser route</text>
<text class="ts" x="530" y="368" text-anchor="middle" dominant-baseline="central">text/image only</text>
</g>

<text class="ts" x="150" y="405" text-anchor="middle">openai · anthropic · google · einfra</text>
<text class="ts" x="340" y="405" text-anchor="middle">claude · codex · opencode</text>
<text class="ts" x="530" y="405" text-anchor="middle">webui (chat.ai.e-infra.cz)</text>

<rect x="60" y="440" width="560" height="55" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="458" text-anchor="middle">rule: capability depends on route, not on most itself</text>
<text class="ts" x="340" y="476" text-anchor="middle">credentials, catalog, gate, and journal stay shared across all three</text>
</svg>
