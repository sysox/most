<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Within the api route, most has commands for text chat, image generation, image analysis, speech synthesis, transcription, and embeddings. Only ai-image produces an image as output. ai-chat and ai-image-analyze accept an image only as input context, and always respond with text.</desc>
