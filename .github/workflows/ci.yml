name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
        shell: bash
      - name: Run lint
        run: uv run ruff check most tests
      - name: Checkout Tandem contract test
        uses: actions/checkout@v4
        with:
          repository: sysox/tandem
          path: tandem
      - name: Run Tandem-to-MOST contract test
        run: uv run pytest tandem/tests/test_most_contract.py
        env:
          MOST_CONTRACT_MOST_ROOT: ${{ github.workspace }}
